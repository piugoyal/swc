apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sylva-secret
  namespace: swct-teama
spec:
  data:
  - secretKey: secrets
    remoteRef:
      key: common/capo
      property: secrets
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: team-secret-store
  target:
    name: sylva-secret

